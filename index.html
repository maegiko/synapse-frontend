<!doctype html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9fc" />
    <script>
      ;(() => {
        let theme = 'light'
        try {
          const saved = localStorage.getItem('synapse-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
        } catch {
          // No storage to read: the default stands for this visit.
        }
        document.documentElement.dataset.theme = theme
        if (theme === 'dark') {
          document.querySelector('meta[name="theme-color"]').content = '#0c0911'
        }
      })()
    </script>
